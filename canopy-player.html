<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080808;
  --bg2:#101010;
  --bg3:#181818;
  --bg4:#222;
  --border:#2a2a2a;
  --border2:#383838;
  --text:#f0ede6;
  --text2:#a09d96;
  --text3:#55524e;
  --red:#e50914;
  --red2:#ff1a24;
  --gold:#e5a00d;
  --gold2:#f5b82e;
  --gold-glow:rgba(229,160,13,.3);
  --blue:#1a3a6e;
  --card-w:200px;
  --card-h:112px;
  --nav-h:64px;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'Outfit',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}

html{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
body{min-height:100vh;overflow-x:hidden}

/* ── NAV ── */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;
  background:linear-gradient(to bottom,rgba(8,8,8,.98) 0%,rgba(8,8,8,0) 100%);
  transition:background .3s;
}
#nav.scrolled{background:rgba(8,8,8,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo{
  font-family:var(--font-display);font-size:32px;letter-spacing:.08em;
  color:var(--gold);text-shadow:0 0 40px var(--gold-glow);
  cursor:pointer;user-select:none;
}
.nav-logo span{color:var(--red)}
.nav-links{display:flex;align-items:center;gap:32px}
.nav-link{
  font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;
  transition:color .15s;letter-spacing:.02em;padding:4px 0;
  border-bottom:2px solid transparent;
}
.nav-link:hover,.nav-link.active{color:var(--text);border-bottom-color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:20px}
.nav-search-wrap{position:relative}
#nav-search{
  background:rgba(255,255,255,.06);border:1px solid var(--border2);
  border-radius:6px;padding:7px 36px 7px 14px;
  color:var(--text);font-family:var(--font-body);font-size:13px;
  width:220px;outline:none;transition:all .2s;
}
#nav-search:focus{border-color:var(--gold);background:rgba(229,160,13,.06);width:280px}
#nav-search::placeholder{color:var(--text3)}
.search-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:14px}

/* ── HERO ── */
#hero{
  position:relative;height:90vh;min-height:560px;
  display:flex;align-items:flex-end;overflow:hidden;
}
#hero-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center top;
  transition:opacity .8s var(--ease);
}
#hero-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to right,rgba(8,8,8,.92) 0%,rgba(8,8,8,.6) 40%,rgba(8,8,8,.1) 70%,transparent 100%),
             linear-gradient(to top,rgba(8,8,8,1) 0%,rgba(8,8,8,.7) 20%,transparent 60%);
}
.hero-content{
  position:relative;z-index:2;padding:0 48px 80px;max-width:640px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin-bottom:16px;
}
.hero-badge::before{content:'';width:28px;height:2px;background:var(--gold)}
.hero-title{
  font-family:var(--font-display);font-size:clamp(48px,6vw,80px);
  letter-spacing:.04em;line-height:.95;color:var(--text);
  margin-bottom:16px;text-shadow:0 4px 32px rgba(0,0,0,.8);
}
.hero-meta{
  display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;
}
.hero-meta-item{font-size:12px;font-weight:500;color:var(--text2)}
.hero-meta-sep{width:3px;height:3px;border-radius:50%;background:var(--text3)}
.hero-rating{
  display:inline-flex;align-items:center;
  border:1px solid var(--text3);padding:1px 6px;border-radius:3px;
  font-size:11px;font-weight:600;color:var(--text2);
}
.hero-desc{
  font-size:14px;color:var(--text2);line-height:1.7;
  margin-bottom:28px;max-width:480px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn-play{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--text);color:#000;
  padding:12px 28px;border-radius:6px;border:none;
  font-family:var(--font-body);font-size:15px;font-weight:700;
  cursor:pointer;transition:all .18s;letter-spacing:.01em;
}
.btn-play:hover{background:#fff;transform:scale(1.03)}
.btn-info{
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.14);color:var(--text);
  padding:12px 28px;border-radius:6px;border:none;
  font-family:var(--font-body);font-size:15px;font-weight:600;
  cursor:pointer;transition:all .18s;backdrop-filter:blur(4px);
}
.btn-info:hover{background:rgba(255,255,255,.22)}

/* hero indicators */
.hero-dots{
  position:absolute;bottom:32px;right:48px;z-index:2;
  display:flex;gap:8px;
}
.hero-dot{
  width:24px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);
  cursor:pointer;transition:all .3s;
}
.hero-dot.active{background:var(--gold);width:40px}

/* ── ROWS ── */
#content{padding:0 0 80px;position:relative;z-index:2;margin-top:-40px}

.row-section{margin-bottom:8px;padding:0 48px}
.row-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.row-title{
  font-family:var(--font-display);font-size:22px;letter-spacing:.04em;
  color:var(--text);display:flex;align-items:center;gap:10px;
}
.row-title-icon{font-size:18px}
.row-see-all{
  font-size:12px;font-weight:600;color:var(--gold);cursor:pointer;
  letter-spacing:.06em;text-transform:uppercase;transition:color .15s;
  border:none;background:none;
}
.row-see-all:hover{color:var(--gold2)}

.cards-wrap{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;
  scroll-behavior:smooth;scrollbar-width:none;
}
.cards-wrap::-webkit-scrollbar{display:none}

/* ── CARD ── */
.card{
  flex-shrink:0;width:var(--card-w);cursor:pointer;
  position:relative;border-radius:6px;overflow:hidden;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);
  background:var(--bg3);
}
.card:hover{
  transform:scale(1.08) translateY(-4px);
  box-shadow:0 20px 40px rgba(0,0,0,.7),0 0 0 1px rgba(229,160,13,.2);
  z-index:10;
}
.card-thumb{
  width:100%;height:var(--card-h);object-fit:cover;display:block;
  background:var(--bg4);
}
.card-thumb-placeholder{
  width:100%;height:var(--card-h);
  background:linear-gradient(135deg,var(--bg3) 0%,var(--bg4) 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:13px;letter-spacing:.1em;
  color:var(--text3);text-align:center;padding:8px;
}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,8,8,.95) 0%,rgba(8,8,8,.2) 50%,transparent 100%);
  opacity:0;transition:opacity .22s;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;
}
.card:hover .card-overlay{opacity:1}
.card-play-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.9);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:8px;transition:background .15s;
}
.card-play-btn:hover{background:#fff}
.card-play-btn svg{width:14px;height:14px;fill:#000;margin-left:2px}
.card-info{padding:8px 8px 10px}
.card-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.card-sub{font-size:11px;color:var(--text3)}
.card-progress{height:2px;background:var(--border);border-radius:1px;margin-top:6px}
.card-progress-fill{height:100%;border-radius:1px;background:var(--red);transition:width .3s}
.card-badge{
  position:absolute;top:6px;right:6px;
  font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border-radius:3px;
}
.badge-new{background:var(--red);color:#fff}
.badge-hd{background:rgba(0,0,0,.6);color:var(--text2);border:1px solid var(--border2)}

/* ── GENRE PILLS ── */
.genre-row{
  display:flex;gap:8px;padding:0 48px 24px;overflow-x:auto;
  scrollbar-width:none;flex-wrap:nowrap;
}
.genre-row::-webkit-scrollbar{display:none}
.genre-pill{
  flex-shrink:0;padding:7px 18px;border-radius:20px;
  border:1px solid var(--border2);background:var(--bg2);
  font-size:12px;font-weight:500;color:var(--text2);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.genre-pill:hover{border-color:var(--gold);color:var(--gold)}
.genre-pill.active{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}

/* ── DETAIL MODAL ── */
#modal-overlay{
  position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.85);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#modal-overlay.open{opacity:1;pointer-events:all}
#modal{
  width:min(860px,94vw);max-height:92vh;overflow-y:auto;
  background:var(--bg2);border-radius:12px;overflow:hidden;
  transform:scale(.95) translateY(20px);transition:transform .25s var(--ease);
  border:1px solid var(--border2);
}
#modal-overlay.open #modal{transform:scale(1) translateY(0)}

.modal-hero{
  position:relative;height:340px;background:var(--bg3);overflow:hidden;
}
.modal-hero-img{
  width:100%;height:100%;object-fit:cover;display:block;opacity:.7;
}
.modal-hero-gradient{
  position:absolute;inset:0;
  background:linear-gradient(to top,var(--bg2) 0%,rgba(16,16,16,.4) 60%,transparent 100%);
}
.modal-hero-content{
  position:absolute;bottom:0;left:0;right:0;padding:24px 32px;
}
.modal-title{
  font-family:var(--font-display);font-size:42px;letter-spacing:.04em;
  color:var(--text);line-height:1;margin-bottom:12px;
}
.modal-btns{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.modal-body{padding:24px 32px 32px}
.modal-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.modal-meta-item{font-size:12px;color:var(--text2);font-weight:500}
.modal-meta-sep{width:3px;height:3px;border-radius:50%;background:var(--text3)}
.modal-rating{display:inline-flex;align-items:center;border:1px solid var(--text3);padding:1px 7px;border-radius:3px;font-size:11px;font-weight:700;color:var(--text2)}
.modal-desc{font-size:14px;color:var(--text2);line-height:1.75;margin-bottom:20px}
.modal-section-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.modal-cast{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal-tag{font-size:11px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);padding:3px 10px;border-radius:12px}
.modal-close{
  position:absolute;top:16px;right:16px;z-index:10;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.6);border:1px solid var(--border2);
  color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.modal-close:hover{background:var(--red);border-color:var(--red)}

/* ── PLAYER ── */
#player-overlay{
  position:fixed;inset:0;z-index:500;background:#000;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#player-overlay.open{opacity:1;pointer-events:all}
#player-video{width:100%;flex:1;background:#000;display:block}
.player-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 100%);
  padding:40px 32px 24px;
  opacity:0;transition:opacity .3s;
}
#player-overlay:hover .player-bar{opacity:1}
.player-title{font-family:var(--font-display);font-size:28px;letter-spacing:.04em;color:var(--text);margin-bottom:12px}
.player-meta{font-size:12px;color:var(--text2);margin-bottom:16px}
.player-controls{display:flex;align-items:center;gap:16px}
.player-btn{
  background:none;border:none;color:var(--text);
  font-size:20px;cursor:pointer;padding:4px;transition:color .15s;
  display:flex;align-items:center;
}
.player-btn:hover{color:var(--gold)}
.player-seek{flex:1;height:4px;appearance:none;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;accent-color:var(--red)}
.player-seek::-webkit-slider-thumb{width:14px;height:14px}
.player-time{font-size:12px;color:var(--text2);white-space:nowrap;min-width:80px;text-align:right}
.player-close{
  position:absolute;top:20px;right:24px;
  background:rgba(0,0,0,.5);border:1px solid var(--border2);
  color:var(--text);border-radius:50%;width:40px;height:40px;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;z-index:10;
}
.player-close:hover{background:var(--red);border-color:var(--red)}
.player-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);pointer-events:none;
}
.player-loading-spinner{
  width:52px;height:52px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SEARCH RESULTS ── */
#search-page{display:none;padding:calc(var(--nav-h) + 32px) 48px 80px}
#search-page.active{display:block}
.search-header{margin-bottom:32px}
.search-title{font-family:var(--font-display);font-size:36px;letter-spacing:.04em;color:var(--text);margin-bottom:6px}
.search-count{font-size:13px;color:var(--text3)}
.search-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;
}

/* ── EMPTY / LOADING ── */
.loading-row{display:flex;gap:10px}
.skeleton{
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:6px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-card{width:var(--card-w);height:calc(var(--card-h) + 52px);flex-shrink:0}

.empty-state{
  text-align:center;padding:80px 24px;
}
.empty-state-icon{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-state-title{font-family:var(--font-display);font-size:28px;letter-spacing:.04em;color:var(--text3);margin-bottom:8px}
.empty-state-sub{font-size:13px;color:var(--text3)}

/* ── HOME/SEARCH TOGGLE ── */
#home-content{display:block}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--bg3);border:1px solid var(--border2);border-radius:8px;
  padding:12px 20px;font-size:13px;color:var(--text2);z-index:600;
  transition:transform .3s var(--ease);box-shadow:0 8px 32px rgba(0,0,0,.5);
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  :root{--card-w:160px;--card-h:90px}
  #nav{padding:0 20px}
  .hero-content{padding:0 20px 60px}
  .row-section{padding:0 20px}
  .genre-row{padding:0 20px 24px}
  #nav-search{width:160px}
  #nav-search:focus{width:200px}
  .modal-title{font-size:28px}
  .modal-body{padding:16px 20px 24px}
  .modal-hero-content{padding:16px 20px}
  .player-controls{gap:10px}
  #search-page{padding:calc(var(--nav-h) + 24px) 20px 60px}
}
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav id="nav">
  <div class="nav-logo" onclick="showHome()">CAN<span>O</span>PY</div>
  <div class="nav-links">
    <div class="nav-link active" id="nl-home" onclick="showHome()">Home</div>
    <div class="nav-link" id="nl-movies" onclick="filterGenre('movie','Movies')">Movies</div>
    <div class="nav-link" id="nl-docs" onclick="filterGenre('documentary','Documentaries')">Documentaries</div>
    <div class="nav-link" id="nl-shorts" onclick="filterGenre('short','Short Films')">Shorts</div>
  </div>
  <div class="nav-right">
    <div class="nav-search-wrap">
      <input type="text" id="nav-search" placeholder="Search titles, people…" oninput="onSearchInput(this.value)">
      <span class="search-icon">⌕</span>
    </div>
  </div>
</nav>

<!-- ── HOME CONTENT ── -->
<div id="home-content">

  <!-- HERO -->
  <section id="hero">
    <div id="hero-bg"></div>
    <div class="hero-content">
      <div class="hero-badge" id="hero-badge">Featured</div>
      <h1 class="hero-title" id="hero-title">CANOPY</h1>
      <div class="hero-meta" id="hero-meta"></div>
      <p class="hero-desc" id="hero-desc">Upload your first video using the Canopy upload tool to get started.</p>
      <div class="hero-btns">
        <button class="btn-play" id="hero-play" onclick="heroPlay()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l11 6-11 6z"/></svg>
          Play
        </button>
        <button class="btn-info" id="hero-info" onclick="heroInfo()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          More Info
        </button>
      </div>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <!-- CONTENT ROWS -->
  <div id="content">
    <!-- Genre pills -->
    <div class="genre-row" id="genre-row">
      <div class="genre-pill active" onclick="setGenre(null,this)">All</div>
      <div class="genre-pill" onclick="setGenre('Action',this)">Action</div>
      <div class="genre-pill" onclick="setGenre('Adventure',this)">Adventure</div>
      <div class="genre-pill" onclick="setGenre('Animation',this)">Animation</div>
      <div class="genre-pill" onclick="setGenre('Comedy',this)">Comedy</div>
      <div class="genre-pill" onclick="setGenre('Crime',this)">Crime</div>
      <div class="genre-pill" onclick="setGenre('Documentary',this)">Documentary</div>
      <div class="genre-pill" onclick="setGenre('Drama',this)">Drama</div>
      <div class="genre-pill" onclick="setGenre('Fantasy',this)">Fantasy</div>
      <div class="genre-pill" onclick="setGenre('Horror',this)">Horror</div>
      <div class="genre-pill" onclick="setGenre('Sci-Fi',this)">Sci-Fi</div>
      <div class="genre-pill" onclick="setGenre('Thriller',this)">Thriller</div>
    </div>

    <div id="row-trending" class="row-section"></div>
    <div id="row-new" class="row-section"></div>
    <div id="row-movies" class="row-section"></div>
    <div id="row-docs" class="row-section"></div>
    <div id="row-shorts" class="row-section"></div>
    <div id="row-continue" class="row-section"></div>
  </div>
</div>

<!-- ── SEARCH PAGE ── -->
<div id="search-page">
  <div class="search-header">
    <h2 class="search-title" id="search-title">Search Results</h2>
    <div class="search-count" id="search-count"></div>
  </div>
  <div class="search-grid" id="search-grid"></div>
</div>

<!-- ── DETAIL MODAL ── -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div class="modal-hero">
      <img id="modal-img" class="modal-hero-img" src="" alt="">
      <div class="modal-hero-gradient"></div>
      <div class="modal-hero-content">
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-btns">
          <button class="btn-play" onclick="playFromModal()">

<!-- ── TOAST ── -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// CONFIG — swap these for your Supabase project
// ═══════════════════════════════════════════════
const SUPABASE_URL = 'https://yddfumooqyvukasfsygh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkZGZ1bW9vcXl2dWthc2ZzeWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODY1NTcsImV4cCI6MjEwMTM2MjU1N30.okmglJ8O-5jdRPfA7eIf4d4nin27pS3t8O8yPNmbopA';

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let allVideos = [];
let heroVideos = [];
let heroIdx = 0;
let heroTimer = null;
let currentVideo = null;
let searchTimer = null;
let currentGenreFilter = null;
const PROGRESS_KEY = 'canopy_progress';

// ═══════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════
async function api(endpoint) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Accept: 'application/json' }
  });
  if (!r.ok) throw new Error(`API ${r.status}`);
  return r.json();
}

async function rpc(fn, body = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) return null;
  return r.json();
}

async function incrementView(id) {
  rpc('increment_view_count', { video_id: id }).catch(() => {});
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
async function init() {
  showSkeletons();
  try {
    const videos = await api('canopy_videos?select=*&visibility=eq.public&status=eq.ready&order=published_at.desc&limit=100');
    allVideos = videos || [];
    renderAll(allVideos);
  } catch(e) {
    console.error('Failed to load:', e);
    showEmpty('row-trending', 'Could not connect to Canopy. Check your network.');
  }
}

// ═══════════════════════════════════════════════
// RENDER ALL
// ═══════════════════════════════════════════════
function renderAll(videos) {
  if (!videos.length) {
    renderEmptyHome();
    return;
  }

  // Hero — top 5 by view count or latest
  heroVideos = [...videos].sort((a,b) => (b.view_count||0)-(a.view_count||0)).slice(0,5);
  buildHeroDots();
  showHero(0);
  startHeroTimer();

  // Rows
  const trending  = [...videos].sort((a,b)=>(b.view_count||0)-(a.view_count||0));
  const newRel    = [...videos].sort((a,b)=>new Date(b.published_at)-new Date(a.published_at));
  const movies    = videos.filter(v=>v.content_type==='movie');
  const docs      = videos.filter(v=>v.content_type==='documentary');
  const shorts    = videos.filter(v=>v.content_type==='short');

  renderRow('row-trending', '🔥 Trending Now',   trending,  'view_count');
  renderRow('row-new',      '✨ New Releases',    newRel,    'published_at');
  renderRow('row-movies',   '🎬 Movies',          movies);
  renderRow('row-docs',     '📽 Documentaries',  docs);
  renderRow('row-shorts',   '⚡ Short Films',     shorts);
  renderContinueRow();
}

function renderEmptyHome() {
  document.getElementById('row-trending').innerHTML = `
    <div class="empty-state">
      <div class="empty-state-icon">🎬</div>
      <div class="empty-state-title">No videos yet</div>
      <div class="empty-state-sub">Open the upload tool to add your first video</div>
    </div>`;
}

// ═══════════════════════════════════════════════
// ROW
// ═══════════════════════════════════════════════
function renderRow(id, title, videos, sortKey) {
  const el = document.getElementById(id);
  if (!videos || !videos.length) { el.innerHTML=''; return; }

  const cards = videos.slice(0,20).map(v => cardHTML(v)).join('');
  el.innerHTML = `
    <div class="row-header">
      <div class="row-title">${title}</div>
      <button class="row-see-all" onclick="seeAll('${id}')">See all →</button>
    </div>
    <div class="cards-wrap">${cards}</div>`;
}

function cardHTML(v) {
  const thumb = v.thumbnail_url
    ? `<img class="card-thumb" src="${esc(v.thumbnail_url)}" alt="${esc(v.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const fallback = `<div class="card-thumb-placeholder" style="display:${v.thumbnail_url?'none':'flex'}">${esc(v.title)}</div>`;
  const prog = getProgress(v.id);
  const progBar = prog > 0 ? `<div class="card-progress"><div class="card-progress-fill" style="width:${prog}%"></div></div>` : '';
  const isNew = isNewRelease(v.published_at);
  const badge = isNew ? '<span class="card-badge badge-new">NEW</span>' : '';

  return `<div class="card" onclick="openDetail('${v.id}')">
    ${thumb}${fallback}
    <div class="card-overlay">
      <button class="card-play-btn" onclick="event.stopPropagation();playVideo('${v.id}')">
        <svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg>
      </button>
      <div style="font-size:11px;font-weight:600;color:#fff;margin-bottom:2px">${esc(v.title)}</div>
      <div style="font-size:10px;color:rgba(255,255,255,.6)">${v.runtime_minutes ? fmtRuntime(v.runtime_minutes) : ''}</div>
    </div>
    <div class="card-info">
      <div class="card-title">${esc(v.title)}</div>
      <div class="card-sub">${[v.release_year, v.genre].filter(Boolean).join(' · ')}</div>
      ${progBar}
    </div>
    ${badge}
  </div>`;
}

// ═══════════════════════════════════════════════
// HERO
// ═══════════════════════════════════════════════
function showHero(idx) {
  if (!heroVideos.length) return;
  heroIdx = (idx + heroVideos.length) % heroVideos.length;
  const v = heroVideos[heroIdx];

  const bg = document.getElementById('hero-bg');
  if (v.thumbnail_url) {
    bg.style.backgroundImage = `url('${v.thumbnail_url}')`;
  } else {
    bg.style.backgroundImage = 'linear-gradient(135deg,#1a0a00 0%,#0f0f1a 100%)';
  }

  document.getElementById('hero-title').textContent = v.title || 'Canopy';
  document.getElementById('hero-badge').textContent = v.genre || 'Featured';

  const meta = [];
  if (v.release_year) meta.push({t:v.release_year});
  if (v.content_rating) meta.push({t:v.content_rating,r:true});
  if (v.runtime_minutes) meta.push({t:fmtRuntime(v.runtime_minutes)});
  if (v.director) meta.push({t:'Dir. '+v.director});

  document.getElementById('hero-meta').innerHTML = meta.map((m,i) =>
    (i>0?'<div class="hero-meta-sep"></div>':'') +
    (m.r ? `<span class="hero-rating">${esc(m.t)}</span>` : `<span class="hero-meta-item">${esc(m.t)}</span>`)
  ).join('');

  document.getElementById('hero-desc').textContent = v.description || '';
  document.getElementById('hero-play').onclick = () => playVideo(v.id);
  document.getElementById('hero-info').onclick = () => openDetailObj(v);

  // Update dots
  document.querySelectorAll('.hero-dot').forEach((d,i) => d.classList.toggle('active', i===heroIdx));
}

function buildHeroDots() {
  const dots = document.getElementById('hero-dots');
  dots.innerHTML = heroVideos.map((_,i) =>
    `<div class="hero-dot${i===0?' active':''}" onclick="jumpHero(${i})"></div>`
  ).join('');
}

function jumpHero(i) {
  stopHeroTimer();
  showHero(i);
  startHeroTimer();
}

function startHeroTimer() {
  stopHeroTimer();
  if (heroVideos.length > 1)
    heroTimer = setInterval(() => showHero(heroIdx+1), 6000);
}

function stopHeroTimer() {
  if (heroTimer) { clearInterval(heroTimer); heroTimer=null; }
}

function heroPlay() { if(heroVideos[heroIdx]) playVideo(heroVideos[heroIdx].id); }
function heroInfo() { if(heroVideos[heroIdx]) openDetailObj(heroVideos[heroIdx]); }

// ═══════════════════════════════════════════════
// DETAIL MODAL
// ═══════════════════════════════════════════════
function openDetail(id) {
  const v = allVideos.find(x=>x.id===id);
  if (v) openDetailObj(v);
}

function openDetailObj(v) {
  currentVideo = v;

  const img = document.getElementById('modal-img');
  img.src = v.thumbnail_url || '';
  img.style.display = v.thumbnail_url ? 'block' : 'none';

  document.getElementById('modal-title').textContent = v.title || '';
  document.getElementById('modal-desc').textContent = v.description || '';

  // Trailer button
  const trailerBtn = document.getElementById('modal-trailer-btn');
  trailerBtn.style.display = v.trailer_url ? 'inline-flex' : 'none';
  trailerBtn.onclick = () => window.open(v.trailer_url, '_blank');

  // Meta
  const metaEl = document.getElementById('modal-meta');
  const metaItems = [
    v.release_year && `<span class="modal-meta-item">${v.release_year}</span>`,
    v.content_rating && `<span class="modal-rating">${esc(v.content_rating)}</span>`,
    v.runtime_minutes && `<span class="modal-meta-item">${fmtRuntime(v.runtime_minutes)}</span>`,
    v.genre && `<span class="modal-meta-item">${esc(v.genre)}</span>`,
    v.country && `<span class="modal-meta-item">${esc(v.country)}</span>`,
    v.view_count && `<span class="modal-meta-item">${fmtViews(v.view_count)} views</span>`,
  ].filter(Boolean);
  metaEl.innerHTML = metaItems.join('<div class="modal-meta-sep"></div>');

  // Director / studio
  if (v.director || v.studio) {
    const extra = [v.director&&`Dir. ${v.director}`, v.studio].filter(Boolean).join(' · ');
    metaEl.innerHTML += `<div style="width:100%;font-size:12px;color:var(--text3);margin-top:4px">${esc(extra)}</div>`;
  }

  // Cast
  const castWrap = document.getElementById('modal-cast-wrap');
  const castEl   = document.getElementById('modal-cast');
  if (v.cast_members && v.cast_members.length) {
    const names = v.cast_members.map(c => c.role ? `${c.name} <span style="color:var(--text3)">(${c.role})</span>` : c.name).join(', ');
    castEl.innerHTML = names;
    castWrap.style.display = 'block';
  } else {
    castWrap.style.display = 'none';
  }

  // Tags
  const tagsWrap = document.getElementById('modal-tags-wrap');
  const tagsEl   = document.getElementById('modal-tags');
  if (v.tags && v.tags.length) {
    tagsEl.innerHTML = v.tags.map(t=>`<span class="modal-tag">#${esc(t)}</span>`).join('');
    tagsWrap.style.display = 'block';
  } else {
    tagsWrap.style.display = 'none';
  }

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay') && !e.target.classList.contains('modal-close')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function playFromModal() {
  closeModal();
  if (currentVideo) playVideo(currentVideo.id);
}

function openTrailer() {
  if (currentVideo?.trailer_url) window.open(currentVideo.trailer_url, '_blank');
}

// ═══════════════════════════════════════════════
// PLAYER
// ═══════════════════════════════════════════════
function playVideo(id) {
  const v = allVideos.find(x=>x.id===id);
  if (!v || !v.video_url) { showToast('No video available for this title.'); return; }
  currentVideo = v;

  const vid = document.getElementById('player-video');
  document.getElementById('player-title').textContent = v.title || '';
  document.getElementById('player-meta').textContent = [v.release_year, v.content_rating, v.genre].filter(Boolean).join(' · ');

  vid.src = v.video_url;

  // Restore progress
  const prog = getSavedTime(v.id);
  if (prog > 10) vid.currentTime = prog;

  document.getElementById('player-overlay').classList.add('open');
  document.getElementById('player-loading').style.display = 'flex';
  document.body.style.overflow = 'hidden';

  vid.play().then(() => {
    document.getElementById('player-loading').style.display = 'none';
    updatePPIcon(true);
    incrementView(v.id);
  }).catch(() => {
    document.getElementById('player-loading').style.display = 'none';
    showToast('Could not play this video. Check the URL in your upload.');
  });
}

function closePlayer() {
  const vid = document.getElementById('player-video');
  if (currentVideo && vid.currentTime > 5) {
    saveProgress(currentVideo.id, vid.currentTime, vid.duration);
  }
  vid.pause();
  vid.src = '';
  document.getElementById('player-overlay').classList.remove('open');
  document.body.style.overflow = '';
  // Refresh continue row
  renderContinueRow();
}

const vid = document.getElementById('player-video');

vid.addEventListener('timeupdate', () => {
  const seek = document.getElementById('player-seek');
  if (vid.duration) {
    seek.max = vid.duration;
    seek.value = vid.currentTime;
    document.getElementById('player-time').textContent = `${fmtTime(vid.currentTime)} / ${fmtTime(vid.duration)}`;
  }
  // Save progress every 5s
  if (currentVideo && Math.round(vid.currentTime) % 5 === 0)
    saveProgress(currentVideo.id, vid.currentTime, vid.duration);
});

vid.addEventListener('waiting', () => document.getElementById('player-loading').style.display='flex');
vid.addEventListener('playing', () => document.getElementById('player-loading').style.display='none');
vid.addEventListener('ended',   () => { closePlayer(); });

function togglePlay() {
  if (vid.paused) { vid.play(); updatePPIcon(true); }
  else { vid.pause(); updatePPIcon(false); }
}

function updatePPIcon(playing) {
  document.getElementById('pp-icon').innerHTML = playing
    ? '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>'
    : '<path d="M5 3l14 9-14 9V3z"/>';
}

function skip(s) { vid.currentTime = Math.max(0, Math.min(vid.duration||0, vid.currentTime+s)); }
function seekTo(v2) { vid.currentTime = parseFloat(v2); }
function toggleMute() { vid.muted = !vid.muted; }
function toggleFullscreen() {
  if (!document.fullscreenElement) document.getElementById('player-overlay').requestFullscreen();
  else document.exitFullscreen();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  const open = document.getElementById('player-overlay').classList.contains('open');
  if (!open) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft')  skip(-10);
  else if (e.key === 'ArrowRight') skip(10);
  else if (e.key === 'f') toggleFullscreen();
  else if (e.key === 'm') toggleMute();
  else if (e.key === 'Escape') closePlayer();
});

// ═══════════════════════════════════════════════
// WATCH PROGRESS (localStorage)
// ═══════════════════════════════════════════════
function getProgressData() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}'); } catch { return {}; }
}
function saveProgress(id, time, duration) {
  const data = getProgressData();
  data[id] = { time, duration, pct: duration ? Math.round(time/duration*100) : 0, ts: Date.now() };
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
}
function getSavedTime(id) { return getProgressData()[id]?.time || 0; }
function getProgress(id) { return getProgressData()[id]?.pct || 0; }

function renderContinueRow() {
  const data = getProgressData();
  const ids = Object.keys(data).filter(id => data[id].pct > 2 && data[id].pct < 95)
    .sort((a,b) => data[b].ts - data[a].ts).slice(0,10);
  const videos = ids.map(id => allVideos.find(v=>v.id===id)).filter(Boolean);
  const el = document.getElementById('row-continue');
  if (!videos.length) { el.innerHTML=''; return; }
  renderRow('row-continue', '▶ Continue Watching', videos);
  // Move continue row to top of content
  const content = document.getElementById('content');
  content.insertBefore(el, content.querySelector('.genre-row').nextSibling);
}

// ═══════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════
function onSearchInput(q) {
  clearTimeout(searchTimer);
  if (!q.trim()) { showHome(); return; }
  searchTimer = setTimeout(() => doSearch(q.trim()), 350);
}

async function doSearch(q) {
  showSearchPage(q);
  const grid = document.getElementById('search-grid');
  grid.innerHTML = '<div class="skeleton" style="height:200px;grid-column:1/-1"></div>';
  try {
    const results = await rpc('search_canopy_videos', { query: q });
    renderSearchResults(q, results || []);
  } catch {
    // Fallback: client-side filter
    const results = allVideos.filter(v =>
      v.title?.toLowerCase().includes(q.toLowerCase()) ||
      v.description?.toLowerCase().includes(q.toLowerCase()) ||
      v.director?.toLowerCase().includes(q.toLowerCase()) ||
      v.genre?.toLowerCase().includes(q.toLowerCase())
    );
    renderSearchResults(q, results);
  }
}

function renderSearchResults(q, results) {
  document.getElementById('search-title').textContent = `Results for "${q}"`;
  document.getElementById('search-count').textContent = `${results.length} title${results.length!==1?'s':''} found`;
  const grid = document.getElementById('search-grid');
  if (!results.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-state-icon">🔍</div>
      <div class="empty-state-title">No results</div>
      <div class="empty-state-sub">Try a different title, genre, or director</div>
    </div>`;
    return;
  }
  grid.innerHTML = results.map(v => cardHTML(v)).join('');
}

// ═══════════════════════════════════════════════
// GENRE FILTER
// ═══════════════════════════════════════════════
function setGenre(genre, el) {
  currentGenreFilter = genre;
  document.querySelectorAll('.genre-pill').forEach(p=>p.classList.remove('active'));
  if (el) el.classList.add('active');
  const filtered = genre ? allVideos.filter(v=>v.genre===genre) : allVideos;
  // Re-render rows with filter
  const trending = [...filtered].sort((a,b)=>(b.view_count||0)-(a.view_count||0));
  renderRow('row-trending', '🔥 '+( genre||'All')+' — Trending', trending);
  renderRow('row-new', '✨ Latest', [...filtered].sort((a,b)=>new Date(b.published_at)-new Date(a.published_at)));
  ['row-movies','row-docs','row-shorts'].forEach(id=>{ document.getElementById(id).innerHTML=''; });
}

function filterGenre(type, label) {
  showHome();
  setNavActive(null);
  const filtered = allVideos.filter(v=>v.content_type===type);
  document.querySelectorAll('.genre-pill').forEach(p=>p.classList.remove('active'));
  renderRow('row-trending', `🎬 ${label}`, filtered);
  renderRow('row-new', '', []);
  ['row-movies','row-docs','row-shorts'].forEach(id=>{ document.getElementById(id).innerHTML=''; });
}

// ═══════════════════════════════════════════════
// NAV / PAGES
// ═══════════════════════════════════════════════
function showHome() {
  document.getElementById('home-content').style.display='block';
  document.getElementById('search-page').classList.remove('active');
  document.getElementById('nav-search').value='';
  setNavActive('nl-home');
  if(allVideos.length) renderAll(allVideos);
}

function showSearchPage(q) {
  document.getElementById('home-content').style.display='none';
  document.getElementById('search-page').classList.add('active');
  setNavActive(null);
}

function setNavActive(id) {
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  if(id) document.getElementById(id)?.classList.add('active');
}

function seeAll(rowId) {
  // For now just scroll to the row
  document.getElementById(rowId)?.scrollIntoView({behavior:'smooth',block:'start'});
}

// ═══════════════════════════════════════════════
// NAV SCROLL BEHAVIOR
// ═══════════════════════════════════════════════
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 60);
});

// ═══════════════════════════════════════════════
// SKELETONS
// ═══════════════════════════════════════════════
function showSkeletons() {
  ['row-trending','row-new','row-movies'].forEach(id => {
    const cards = Array(8).fill(`<div class="skeleton skeleton-card"></div>`).join('');
    document.getElementById(id).innerHTML = `
      <div class="row-header"><div class="skeleton" style="width:180px;height:22px;border-radius:4px"></div></div>
      <div class="loading-row">${cards}</div>`;
  });
}

function showEmpty(rowId, msg) {
  document.getElementById(rowId).innerHTML = `
    <div class="empty-state">
      <div class="empty-state-icon">⚠️</div>
      <div class="empty-state-title">Connection error</div>
      <div class="empty-state-sub">${msg}</div>
    </div>`;
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3500);
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtRuntime(m) {
  if(!m) return '';
  const h=Math.floor(m/60), mn=m%60;
  return h ? `${h}h ${mn}m` : `${mn}m`;
}
function fmtViews(n) {
  if(!n) return '';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}
function fmtTime(s) {
  if(!s||isNaN(s)) return '0:00';
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=Math.floor(s%60);
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}
function isNewRelease(date) {
  if(!date) return false;
  return (Date.now()-new Date(date).getTime()) < 7*24*60*60*1000;
}

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
init();
</script>
