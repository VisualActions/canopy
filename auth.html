<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canopy — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080808;--bg2:#101010;--bg3:#181818;--border:#2a2a2a;--border2:#383838;--text:#f0ede6;--text2:#a09d96;--text3:#55524e;--red:#e50914;--gold:#e5a00d;--gold-glow:rgba(229,160,13,.3);--font-display:'Bebas Neue',sans-serif;--font-body:'Outfit',sans-serif}
html{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top,#1a0a00 0%,var(--bg) 60%)}

.logo{font-family:var(--font-display);font-size:48px;letter-spacing:.08em;color:var(--gold);text-shadow:0 0 40px var(--gold-glow);text-align:center;margin-bottom:4px;text-decoration:none;display:block}
.logo span{color:var(--red)}
.tagline{font-size:13px;color:var(--text3);text-align:center;margin-bottom:40px;letter-spacing:.04em}

.card{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:36px;width:100%;max-width:420px}

.tabs{display:flex;gap:0;margin-bottom:28px;background:var(--bg3);border-radius:8px;padding:4px}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border-radius:6px;transition:all .2s;letter-spacing:.02em}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}

.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:14px;padding:11px 14px;outline:none;transition:all .2s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(229,160,13,.12)}
.field input::placeholder{color:var(--text3)}

.btn{width:100%;height:48px;background:var(--red);border:none;border-radius:10px;color:#fff;font-family:var(--font-display);font-size:22px;letter-spacing:.1em;cursor:pointer;transition:all .2s;margin-top:8px}
.btn:hover{background:#ff1a24;box-shadow:0 6px 24px rgba(229,9,20,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-size:11px;color:var(--text3)}

.error{background:rgba(229,9,20,.1);border:1px solid rgba(229,9,20,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#ff6b6b;margin-bottom:16px;display:none}
.error.show{display:block}
.success{background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#2ecc71;margin-bottom:16px;display:none}
.success.show{display:block}

.back-link{text-align:center;margin-top:20px;font-size:12px;color:var(--text3)}
.back-link a{color:var(--gold);text-decoration:none}
.back-link a:hover{text-decoration:underline}

.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<a class="logo" href="index.html">CAN<span>O</span>PY</a>
<div class="tagline">Watch. Create. Stream.</div>

<div class="card">
  <div class="tabs">
    <div class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</div>
    <div class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <div id="error-msg" class="error"></div>
  <div id="success-msg" class="success"></div>

  <!-- SIGN IN -->
  <div id="form-signin">
    <div class="field">
      <label>Email</label>
      <input type="email" id="si-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="si-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="btn-signin" onclick="signIn()">SIGN IN</button>
  </div>

  <!-- SIGN UP -->
  <div id="form-signup" style="display:none">
    <div class="field">
      <label>Display name</label>
      <input type="text" id="su-name" placeholder="YoCreedo" autocomplete="name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="su-pass" placeholder="Min. 8 characters" autocomplete="new-password">
    </div>
    <button class="btn" id="btn-signup" onclick="signUp()">CREATE ACCOUNT</button>
  </div>

  <div class="back-link">
    <a href="index.html">← Back to Canopy</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://yddfumooqyvukasfsygh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkZGZ1bW9vcXl2dWthc2ZzeWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODY1NTcsImV4cCI6MjEwMTM2MjU1N30.okmglJ8O-5jdRPfA7eIf4d4nin27pS3t8O8yPNmbopA';

function switchTab(tab) {
  document.getElementById('tab-signin').classList.toggle('active', tab==='signin');
  document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
  document.getElementById('form-signin').style.display = tab==='signin' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab==='signup' ? 'block' : 'none';
  hideMessages();
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('success-msg').classList.remove('show');
}
function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('error-msg').classList.remove('show');
}
function hideMessages() {
  document.getElementById('error-msg').classList.remove('show');
  document.getElementById('success-msg').classList.remove('show');
}

async function authFetch(endpoint, body) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Auth failed');
  return data;
}

async function signIn() {
  const email = document.getElementById('si-email').value.trim();
  const pass  = document.getElementById('si-pass').value;
  if (!email || !pass) { showError('Fill in both fields.'); return; }
  const btn = document.getElementById('btn-signin');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>SIGNING IN...';
  hideMessages();
  try {
    const data = await authFetch('token?grant_type=password', { email, password: pass });
    saveSession(data);
    // Check if admin
    const profile = await fetchProfile(data.access_token);
    if (profile?.role === 'admin') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'index.html';
    }
  } catch(e) {
    showError(e.message);
    btn.disabled = false;
    btn.textContent = 'SIGN IN';
  }
}

async function signUp() {
  const name  = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pass  = document.getElementById('su-pass').value;
  if (!email || !pass) { showError('Email and password required.'); return; }
  if (pass.length < 8) { showError('Password must be at least 8 characters.'); return; }
  const btn = document.getElementById('btn-signup');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>CREATING...';
  hideMessages();
  try {
    const data = await authFetch('signup', { email, password: pass, data: { display_name: name } });
    if (data.access_token) {
      saveSession(data);
      showSuccess('Account created! Redirecting...');
      setTimeout(() => window.location.href = 'index.html', 1200);
    } else {
      showSuccess('Check your email to confirm your account, then sign in.');
      btn.disabled = false;
      btn.textContent = 'CREATE ACCOUNT';
    }
  } catch(e) {
    showError(e.message);
    btn.disabled = false;
    btn.textContent = 'CREATE ACCOUNT';
  }
}

function saveSession(data) {
  localStorage.setItem('canopy_token', data.access_token);
  localStorage.setItem('canopy_refresh', data.refresh_token || '');
  localStorage.setItem('canopy_user', JSON.stringify(data.user || {}));
}

async function fetchProfile(token) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${JSON.parse(atob(token.split('.')[1])).sub}&select=*`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}` }
    });
    const data = await r.json();
    return data[0] || null;
  } catch { return null; }
}

// If already signed in, redirect
const tok = localStorage.getItem('canopy_token');
if (tok) window.location.href = 'index.html';

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('form-signin').style.display !== 'none') signIn();
    else signUp();
  }
});
</script>
</body>
</html>
